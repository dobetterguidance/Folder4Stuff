# Connect this repo to Netlify once (production branch: claude/shelf-to-supper-app-1pvtn1);
# every push to that branch then updates every family phone.
[build]
  publish = "app"

# Always check for a fresh app shell so updates reach phones on the next open.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
