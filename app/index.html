function thawTasks(){const tasks=[];for(const day of db.plan.filter(p=>p.recipe&&!p.cooked)){const recipe=db.recipes.find(r=>r.id===day.recipe);if(!recipe)continue;for(const ing of recipe.ingredients){
 const required=ing.qty*scaled(recipe);
 const refrigerated=stockStatus(ing,db.inventory.filter(i=>inType(i,'fridge')&&i.space!=='b1'),scaled(recipe));
 if(refrigerated.has)continue;
 const sources=db.inventory.filter(i=>Number(i.qty)>0&&inType(i,'freezer')&&key(i.name)===key(ing.name));if(!sources.length)continue;
 const src=sources[0],due=moveDate(day.date,-1),taskKey=`${day.date}|${key(ing.name)}`;
 if(!tasks.some(t=>t.id===taskKey))tasks.push({id:taskKey,day:day.date,due,name:ing.name,source:src.space,itemId:src.id,qty:refrigerated.missing,unit:ing.unit,recipe:recipe.name});}}
 return tasks.sort((a,b)=>a.due.localeCompare(b.due));}
function weekSlots(){if(!db.plan.length)return [];return [...db.plan].sort((a,b)=>a.date.localeCompare(b.date))}
function planMeals(){
 const chosen=[],types={},cuisineCounts={},reserved=structuredClone(currentStock()),groceryKeys=new Set();
 const wanted=Number(db.settings.meals)||5,recipes=[...db.recipes];
 for(let d=0;d<7;d++){
  const date=moveDate(db.weekStart,d);if(chosen.length>=wanted){chosen.push({date,recipe:null,cooked:false});continue}
  const candidates=recipes.filter(r=>!chosen.some(x=>x.recipe===r.id)&&db.settings.cuisines.includes(r.cuisine||'American'));if(!candidates.length){chosen.push({date,recipe:null,cooked:false});continue}
  const rank=(r)=>{
   let value=0;for(const ing of r.ingredients){
    const st=stockStatus(ing,reserved,scaled(r));if(basic(ing.name)){value+=.75;continue}
    if(st.has)value+=3.2;else if(st.uncertain)value-=1.5;else if(st.sources.length)value-=1.2;else value-=3.1;
    if(st.missing>.01&&['salmon','shrimp','chicken breast','ground beef','ground turkey','gluten-free sausage'].includes(key(ing.name)))value-=3.5;
    if(st.missing>.01&&groceryKeys.has(key(ing.name)))value+=.9;
    if(st.sources.some(s=>inType(s,'freezer')))value+=.2;
    if(st.sources.some(s=>s.expires&&s.expires<=moveDate(isoDate(new Date()),5)))value+=.8;
   }
   value-=((types[r.type]||0)*4.5);value-=((cuisineCounts[r.cuisine]||0)*1.7);
   return value;
  };
  candidates.sort((a,b)=>rank(b)-rank(a)||a.name.localeCompare(b.name));
  const r=candidates[0];chosen.push({date,recipe:r.id,cooked:false});types[r.type]=(types[r.type]||0)+1;cuisineCounts[r.cuisine]=(cuisineCounts[r.cuisine]||0)+1;
  for(const ing of r.ingredients){if(basic(ing.name))continue;let needed=ing.qty*scaled(r);
   const matched=reserved.filter(i=>key(i.name)===key(ing.name)&&i.qty>0).sort((a,b)=>(inType(a,'fridge')?0:1)-(inType(b,'fridge')?0:1));
   for(const item of matched){let available=convert(item.qty,item.unit,ing.unit);if(available==null)continue;let used=Math.min(needed,available);item.qty=Math.max(0,item.qty-convert(used,ing.unit,item.unit));needed-=used;if(needed<.001)break}
   if(needed>.001)groceryKeys.add(key(ing.name));
  }
 }
 db.plan=chosen;db.checkedGroceries=[];db.thawDone=[];persist();toast('Your dinners are planned.');render();
}

<section class="grid two">${db.spaces.map(s=>{const last=lastTemp(s.id),t=tempState(s),hist=db.temperatures.filter(x=>x.space===s.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,4);return `<div class="panel"><div class="temp-row"><div><h3>${s.icon} ${safe(s.name)}</h3><span class="pill ${t.state==='danger'?'danger':t.state==='blank'?'blank':''}">${s.type==='freezer'?'Target ≤ 0°F':s.type==='fridge'?'Target ≤ 40°F':'Ambient · info'}</span></div><div class="tempval ${t.state==='danger'?'danger':'normal'}">${last?displayQty(last.f)+'°':'—'}</div><form class="reading-action" data-form="temp" data-space="${s.id}"><div class="buttonrow" style="flex-wrap:nowrap"><input name="reading" type="number" step="0.1" placeholder="°F" required style="width:100%;min-width:0;min-height:38px;border:1px solid #ccd8ce;border-radius:9px;padding:8px"><button class="button primary smallbtn" type="submit">Log</button></div></form></div><div class="temp-history">${hist.length?hist.map(x=>`<span><b>${displayQty(x.f)}°F</b> · ${new Date(x.at).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</span>`).join(''):'<span>No readings logged</span>'}</div>${t.state==='danger'?'<div class="pill danger" style="margin-top:11px">⚠ Above recommended target—check unit and food temperatures</div>':''}</div>`}).join('')}</section><p class="note" style="margin-top:13px">This version stores manual readings and only checks when you open it. It cannot receive thermometer data or send automatic alarms yet.</p>`}
function renderRecipes(){let recipes=db.recipes.filter(r=>(ui.recType==='all'||r.type===ui.recType)&&(ui.recCuisine==='all'||r.cuisine===ui.recCuisine)&&(r.name.toLowerCase().includes(ui.recSearch.toLowerCase())||r.ingredients.some(i=>i.name.toLowerCase().includes(ui.recSearch.toLowerCase())))).sort((a,b)=>scoreRecipe(b).score-scoreRecipe(a).score);let types=[...new Set(db.recipes.map(r=>r.type))].sort();return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">YOUR RECIPE LIBRARY</div><h1 style="margin:5px 0 8px">Simple dinner ideas</h1><p class="tagline">${db.recipes.length} meals · Asian, Mexican, American and Italian · Verify packaged ingredients are gluten-free</p></div><button class="button primary smallbtn" data-action="addRecipe">＋ Recipe</button></div><div class="toolbar"><input id="recipe-search" placeholder="Search recipes or ingredients..." value="${safe(ui.recSearch)}"><select id="recipe-type"><option value="all">All proteins</option>${types.map(t=>`<option ${ui.recType===t?'selected':''}>${safe(t)}</option>`).join('')}</select><select id="recipe-cuisine"><option value="all">All cuisines</option>${CUISINES.map(t=>`<option ${ui.recCuisine===t?'selected':''}>${t}</option>`).join('')}</select></div>
<section class="grid three">${recipes.length?recipes.map(r=>{const s=scoreRecipe(r);return `<div class="panel recipe-card"><div class="recipe-tags"><span class="pill">${safe(r.cuisine||'American')}</span><span class="pill">${safe(r.type)}</span><span class="pill blue">${r.mins} min</span>${r.custom?'<span class="pill warn">My recipe</span>':''}</div><div class="recipe-name">${safe(r.name)}</div><p>${r.ingredients.slice(0,4).map(i=>i.name).join(' · ')}</p><div class="score">${s.owned} of ${r.ingredients.length} ingredients on hand or assumed basics</div><div class="buttonrow"><button class="button smallbtn" data-action="viewRecipe" data-id="${r.id}">See recipe</button><button class="button soft smallbtn" data-action="quickPlanRecipe" data-id="${r.id}">＋ Week</button></div></div>`}).join(''):`<div class="empty"><h3>No matching recipes</h3><p>Try another search.</p></div>`}</section>`}
function renderSettings(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">MAKE IT YOURS</div><h1 style="margin:5px 0 8px">Kitchen settings</h1><p class="tagline">Customize your spaces, family meals, and data backups.</p></div></div>
<div class="grid two"><section class="panel"><h3>Weekly planning</h3><div class="config-row"><label for="servings"><b>People / servings per meal</b></label><select id="servings" style="min-width:80px"><option value="2" ${db.settings.servings===2?'selected':''}>2</option><option value="3" ${db.settings.servings===3?'selected':''}>3</option><option value="4" ${db.settings.servings===4?'selected':''}>4</option><option value="5" ${db.settings.servings===5?'selected':''}>5</option><option value="6" ${db.settings.servings===6?'selected':''}>6</option><option value="8" ${db.settings.servings===8?'selected':''}>8</option></select></div><div class="config-row"><label for="mealCount"><b>Dinners to plan each week</b></label><select id="mealCount">${[3,4,5,6,7].map(n=>`<option value="${n}" ${db.settings.meals===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="config-row"><label for="weekStart"><b>Week starts</b></label><input id="weekStart" type="date" value="${safe(db.weekStart)}"></div><div class="config-row"><label for="basics"><b>Assume simple pantry basics</b><div class="tiny">Oil and water only. Spices are checked against your rack.</div></label><input type="checkbox" id="basics" ${db.settings.assumeBasics?'checked':''}></div><div class="config-row"><div><b>Favorite cuisines</b><div class="tiny">Include these in automatic meal plans</div></div><div class="buttonrow">${CUISINES.map(c=>`<label class="pill" style="cursor:pointer"><input type="checkbox" data-cuisine="${c}" ${db.settings.cuisines.includes(c)?'checked':''}> ${c}</label>`).join('')}</div></div><div class="config-row"><span><b>Gluten-free built-in recipe library</b><div class="tiny">Use certified GF packaged ingredients; custom recipes are your responsibility.</div></span><span class="pill">On</span></div><p class="note" style="margin-top:12px">Changing servings or pantry assumptions automatically recalculates the grocery list. Rebuild the meal plan to change the dinner count.</p></section>
<section class="panel"><h3>Shopping preferences</h3><p class="muted small">These are your usual starting points, not verified lowest prices. Choose any other retailer on an item.</p><div class="field"><label>Default local grocery</label><select id="storeLocal">${STORES.filter(s=>s.kind==='local').map(s=>`<option value="${s.id}" ${db.settings.storeLocal===s.id?'selected':''}>${safe(s.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:14px"><label>Preferred Costco for bulk list</label><select id="storeCostco">${STORES.filter(s=>s.kind==='costco').map(s=>`<option value="${s.id}" ${db.settings.storeCostco===s.id?'selected':''}>${safe(s.name)}</option>`).join('')}</select></div><p class="tiny" style="margin-top:15px">Online options: Walmart Online, Amazon, Amazon Fresh and Weee!. Availability varies by ZIP code and product. No checkout or automatic pricing is connected.</p><button class="button smallbtn" data-tab="shopping" style="margin-top:10px">View shopping lists →</button></section><section class="panel"><h3>Rename your eight spaces</h3><form id="rename-spaces" data-form="spaces"><div class="grid two" style="gap:10px">${db.spaces.map(s=>`<div class="field"><label>${s.icon} ${s.type==='spice'?'Spice rack':s.type==='pantry'?'Pantry':s.type==='freezer'?'Freezer':'Fridge'}</label><input maxlength="32" name="${s.id}" value="${safe(s.name)}" required></div>`).join('')}</div><button class="button primary" style="margin-top:13px" type="submit">Save names</button></form></section>
<section class="panel"><h3>Your data & backups</h3><p class="muted small">Data is stored on this browser and device, including photos/PDFs in browser media storage. Use a hosted HTTPS app for reliable long-term use. Backups include uploaded media and may be large.</p><div class="buttonrow"><button class="button" data-action="exportJson">↓ Full backup</button><button class="button" data-action="exportInventory">↓ Inventory CSV</button><button class="button" data-action="importJson">⇧ Restore backup</button></div><input type="file" accept="application/json,.json" id="import-file" hidden><div class="divider"></div><div class="buttonrow"><button class="button danger smallbtn" data-action="clearAll">Reset all data</button></div></section>
<section class="panel"><h3>About this version</h3><p class="muted small">You can use this as a standalone app. For family-wide live syncing, barcode scanning, sensor readings and push notifications, we'll connect it to a hosted database in the next phase.</p><div class="softpanel"><b>Tip:</b> Bulk add is ideal for your first big freezer inventory. Add a few foods, generate a plan, then make adjustments after your first week.</div></section></div>`}
function toast(text){const el=$('#toast');el.className='toast';el.textContent=text;el.hidden=false;clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.hidden=true,2700)}
function modal(html){let d=$('#modal');d.innerHTML=`<div class="modalwrap pop">${html}</div>`;d.showModal()}
function closeModal(){const d=$('#modal');if(d.open)d.close()}
const modalHead=title=>`<div class="modal-head"><h2>${title}</h2><button type="button" class="close" data-action="closeModal" aria-label="Close">×</button></div>`;
function itemDialog(existing=null){const i=existing||{name:'',qty:1,unit:'each',space:'f1',expires:'',spot:'',note:''};modal(`${modalHead(existing?'Edit inventory item':'Add food to your kitchen')}<form data-form="item"><input type="hidden" name="id" value="${safe(existing?.id||'')}"><div class="field"><label for="itemname">What is it?</label><input id="itemname" name="name" value="${safe(i.name)}" placeholder="Chicken breast, frozen corn, milk..." required maxlength="100" autofocus></div><div class="formgrid" style="margin-top:13px"><div class="field"><label>Quantity</label><input name="qty" type="number" min="0" step="0.01" value="${i.qty}" required></div><div class="field"><label>Unit</label><select name="unit">${['each','lb','oz','cup','tbsp','tsp','can','bag','package','jar','head','bunch'].map(u=>`<option value="${u}" ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Storage space</label><select name="space">${db.spaces.map(s=>`<option value="${s.id}" ${i.space===s.id?'selected':''}>${safe(s.name)}</option>`).join('')}</select></div><div class="field"><label>Spot (optional)</label><input name="spot" maxlength="55" placeholder="Top shelf, left basket" value="${safe(i.spot||'')}"></div><div class="field"><label>Best by / use by (optional)</label><input name="expires" type="date" value="${safe(i.expires||'')}"></div><div class="field"><label>Note (optional)</label><input name="note" maxlength="90" placeholder="2 breasts per bag" value="${safe(i.note||'')}"></div></div><div class="buttonrow" style="margin-top:18px"><button class="button primary" type="submit">${existing?'Save changes':'Save food'}</button>${existing?`<button type="button" class="button danger" data-action="deleteItem" data-id="${existing.id}">Delete</button>`:''}</div></form>`);$('#itemname')?.focus()}
function bulkDialog(){modal(`${modalHead('Add a freezer or pantry list')}<p class="muted small">One item per line. Use: <b>name | quantity | unit | space</b>. You can leave fields out and choose a default space below.</p><form data-form="bulk"><div class="field"><label>Default storage space</label><select name="space">${db.spaces.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Paste or type your list</label><textarea name="bulk" required rows="9" placeholder="Chicken breast | 4 | each\nGround beef | 3 | lb\nCorn | 2 | bags\nRice noodles | 16 | oz"></textarea></div><p class="tiny">Space field can be a name (e.g. Freezer 2). Supported units: each, lb, oz, cup, can, bag, package. Unrecognized units are set to each.</p><button class="button primary" type="submit">Add all items</button></form>`)}
function recipeDialog(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;const s=scoreRecipe(r);modal(`${modalHead(safe(r.name))}<div class="recipe-tags"><span class="pill">${safe(r.cuisine||'American')}</span><span class="pill">${safe(r.type)}</span><span class="pill blue">${r.mins} min</span><span class="pill">${db.settings.servings} servings</span></div><p class="muted small" style="margin:12px 0">${s.owned} of ${r.ingredients.length} ingredients on hand or assumed basics</p><h3>Ingredients</h3><ul class="ingredients-list">${r.ingredients.map(i=>{let st=stockStatus(i,currentStock(),scaled(r));return `<li>${safe(amountText(i.qty*scaled(r),i.unit))} <b>${safe(i.name)}</b> <span class="pill ${st.has?'':'warn'}">${st.has?'on hand':st.uncertain?'check stock':'need'}</span></li>`}).join('')}</ul><h3>How to make it</h3><ol class="instructions-list">${r.steps.map(s=>`<li>${safe(s)}</li>`).join('')}</ol><div class="buttonrow"><button class="button primary" data-action="quickPlanRecipe" data-id="${r.id}">＋ Add to this week</button>${r.custom?`<button class="button danger" data-action="deleteRecipe" data-id="${r.id}">Delete recipe</button>`:''}</div><p class="tiny" style="margin-top:15px">Check labels for gluten and allergens. Cooking times are estimates; follow safe internal-temperature guidance.</p>`)}
function editRecipeDialog(){modal(`${modalHead('Create a family recipe')}<form data-form="recipe"><div class="formgrid"><div class="field span2"><label>Recipe name</label><input name="name" required placeholder="Grandma's chicken casserole"></div><div class="field"><label>Category</label><select name="type">${['Chicken','Beef','Pork','Turkey','Fish','Meatless','Breakfast','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label>Cuisine</label><select name="cuisine">${CUISINES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label>Minutes</label><input type="number" min="5" max="300" value="30" name="mins" required></div><div class="field span2"><label>Ingredients — one per line</label><textarea name="ingredients" required rows="6" placeholder="2 | each | chicken breast\n2 | cups | corn\n1 | cup | shredded cheese"></textarea><div class="tiny">Format: quantity | unit | ingredient name. Recipe amounts are for four servings.</div></div><div class="field span2"><label>Directions — one step per line</label><textarea name="steps" required rows="5" placeholder="Cook the chicken thoroughly.\nMix everything together and serve."></textarea></div></div><button class="button primary" style="margin-top:15px" type="submit">Save recipe</button></form>`)}
function swapDialog(date){modal(`${modalHead('Choose dinner for '+safe(weekday(date)))}<p class="muted small">Swap meals without starting over.</p><div class="toolbar"><input id="swap-search" placeholder="Filter dinner ideas..." oninput="this.closest('dialog').querySelectorAll('[data-swap-title]').forEach(x=>x.hidden=!x.dataset.swapTitle.includes(this.value.toLowerCase()))"></div><div style="max-height:52vh;overflow:auto">${[...db.recipes].sort((a,b)=>scoreRecipe(b).score-scoreRecipe(a).score).map(r=>{const s=scoreRecipe(r);return `<div class="listrow" data-swap-title="${safe(r.name.toLowerCase())}"><div class="item-main"><b>${safe(r.name)}</b><div class="item-sub">${s.missing} missing · ${r.mins} min</div></div><button class="button smallbtn" data-action="chooseMeal" data-id="${r.id}" data-date="${date}">Choose</button></div>`}).join('')}<div class="listrow"><div class="item-main"><b>Leftovers / Flex night</b></div><button class="button smallbtn" data-action="chooseMeal" data-id="none" data-date="${date}">Choose</button></div></div>`)}
function groceryDialog(){modal(`${modalHead('Add to your shopping list')}<form data-form="grocery"><div class="field"><label>What do you need?</label><input name="name" placeholder="Ginger, paper towels, 10 lb ground beef..." required maxlength="100" autofocus></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Amount (optional)</label><input name="qty" placeholder="2 lb, 1 bag, 12 cans..." maxlength="70"></div><div class="field"><label>Shopping trip</label><select name="trip"><option value="regular">Regular weekly groceries</option><option value="bulk">Stock-up / Costco</option></select></div><div class="field span2"><label>Store</label><select name="store"><option value="auto">Suggest for me</option>${STORES.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('')}</select></div></div><p class="tiny" style="margin-top:12px">Select Costco stock-up for items you want to buy on your next Fargo or St. Cloud trip, or choose an online store.</p><button class="button primary" style="margin-top:12px" type="submit">Add to shopping</button></form>`);}
function moveThaw(keyId){const t=thawTasks().find(t=>t.id===keyId);if(!t)return toast('That item is not in the current thaw list.');const src=db.inventory.find(i=>i.id===t.itemId);if(!src)return toast('Food entry no longer available.');const match=convert(t.qty,t.unit,src.unit);
 const amount=match==null?null:Math.min(src.qty,match);
 if(amount==null){if(confirm(`Move ${t.name} from ${spaceBy(src.space)?.name} to a refrigerator? The quantity units differ, so please edit the locations yourself.`))toast('Open Inventory to transfer this food manually.');return;}
 const to=db.spaces.find(s=>s.type==='fridge'&&s.id!=='b1');const moved=qtyFmt(amount);
 if(!confirm(`Transfer ${amountText(moved,src.unit)} of ${src.name} from ${spaceBy(src.space)?.name} to ${to.name}?\n\nOnly confirm after you physically move it.`))return;
 src.qty=qtyFmt(src.qty-moved);db.inventory.push({...src,id:uid(),qty:moved,space:to.id,added:isoDate(new Date()),expires:'',spot:'Thawing'});db.inventory=db.inventory.filter(i=>i.qty>0);persist();toast('Moved in inventory. Thaw in the refrigerator.');render();}
function consumeRecipe(date){const day=db.plan.find(p=>p.date===date);if(!day)return;
 if(day.cooked){if(!confirm('Undo cooked status and restore the quantities originally deducted from inventory?'))return;
  for(const use of day.consumed||[]){let item=db.inventory.find(i=>i.id===use.original.id);
   if(item)item.qty=qtyFmt(item.qty+use.used);else db.inventory.push({...use.original,qty:use.used});}
  day.cooked=false;delete day.consumed;persist();toast('Meal undone; deducted food restored.');return render();}
 const r=db.recipes.find(r=>r.id===day.recipe);if(!r)return;
 if(!confirm(`Mark ${r.name} as cooked?\n\nThis deducts food recorded in compatible units. Missing or uncertain amounts may need a manual adjustment.`))return;
 const consumed=[];
 for(const ing of r.ingredients){if(basic(ing.name))continue;let need=ing.qty*scaled(r);const items=db.inventory.filter(i=>key(i.name)===key(ing.name)&&i.qty>0).sort((a,b)=>{let t=x=>inType(x,'fridge')?0:inType(x,'pantry')?1:2;return t(a)-t(b)});
 for(const item of items){let unitQty=convert(item.qty,item.unit,ing.unit);if(unitQty==null)continue;let used=Math.min(need,unitQty);let deduct=convert(used,ing.unit,item.unit);consumed.push({original:{...item},used:deduct});item.qty=qtyFmt(item.qty-deduct);need-=used;if(need<=.001)break;}}
 db.inventory=db.inventory.filter(i=>i.qty>.001);day.cooked=true;day.consumed=consumed;persist();toast('Meal cooked; matching food deducted.');render()}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvCell(x){const text=String(x??'');return `"${text.replace(/"/g,'""')}"`}
function exportCsv(name,headers,rows){download(name,[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);toast('Copied to clipboard.')}else{const field=document.createElement('textarea');field.value=value;document.body.appendChild(field);field.select();document.execCommand('copy');field.remove();toast('Copied to clipboard.')}}catch(e){modal(`${modalHead('Copy your list')}<textarea style="width:100%;height:50vh">${safe(value)}</textarea>`)}}
function addToWeek(id){let days=db.plan;if(!days.length){db.plan=Array.from({length:7},(_,i)=>({date:moveDate(db.weekStart,i),recipe:null,cooked:false}));days=db.plan;}let empty=days.find(x=>!x.recipe);if(empty){empty.recipe=id;empty.cooked=false;}else{const d=days.find(x=>!x.cooked);if(!d)return toast('All seven days are marked cooked.');if(!confirm(`Replace ${weekday(d.date)} with this recipe?`))return;d.recipe=id;}persist();closeModal();ui.tab='meals';render();toast('Recipe added to this week.');}
function handleAction(el){let action=el.dataset.action,id=el.dataset.id,date=el.dataset.date;
 if(action==='spiceAdd')return spiceDialog(null,el.dataset.name||'');
 if(action==='spiceEdit')return spiceDialog(db.inventory.find(i=>i.id===id));
 if(action==='spiceShop')return spiceToShopping(id);
 if(action==='spicesShopAll')return spiceShopAll();
 if(action==='spiceFilter'){ui.spiceFilter=el.dataset.value;return render()}
 if(action==='spiceQuickUse')return spiceQuickUse(id);
 if(action==='spiceRemove')return removeSpice(id);
 if(action==='applianceEdit')return applianceDialog(id);
 if(action==='addSnapshot')return snapshotDialog(id);
 if(action==='addReceipt')return receiptDialog();
 if(action==='viewReceipt')return receiptDetails(id);
 if(action==='deleteReceipt')return deleteReceipt(id);
 if(action==='deleteSnapshot')return deleteSnapshot(id);
 if(action==='openMedia')return openMedia(id);
 if(action==='receiptToInventory')return receiptInventoryDialog(id);
 if(action==='goSpaceInventory'){ui.filter=id;ui.tab='inventory';return render()}
 if(action==='goInsights'){ui.tab='insights';return render()}
 if(action==='goReceipts'){ui.tab='receipts';return render()}
 if(action==='goSpaces'){ui.tab='spaces';return render()}

 if(action==='addItem')itemDialog();else if(action==='editItem'){const it=db.inventory.find(i=>i.id===id);if(it?.space==='s1')spiceDialog(it);else itemDialog(it);}else if(action==='closeModal')closeModal();else if(action==='bulk')bulkDialog();else if(action==='viewSpace'){ui.filter=id;ui.search='';ui.tab='inventory';render()}
 else if(action==='useOne'){const item=db.inventory.find(i=>i.id===id);if(!item)return;item.qty=qtyFmt(Math.max(0,item.qty-1));if(item.space!=='s1')db.inventory=db.inventory.filter(x=>x.qty>0);persist();render();toast('Used 1 '+item.unit)}
 else if(action==='deleteItem'){if(confirm('Delete this inventory entry?')){db.inventory=db.inventory.filter(i=>i.id!==id);persist();closeModal();render()}}
 else if(action==='planWeek'){if(db.plan.length&&!confirm('Rebuild this week? This replaces selected dinners and resets grocery checks.'))return;planMeals()}
 else if(action==='viewRecipe')recipeDialog(id);else if(action==='quickPlanRecipe')addToWeek(id);else if(action==='swapMeal')swapDialog(date);else if(action==='chooseMeal'){const day=db.plan.find(p=>p.date===date);if(day){day.recipe=id==='none'?null:id;day.cooked=false}persist();closeModal();render()}
 else if(action==='toggleCooked')consumeRecipe(date);else if(action==='moveThaw')moveThaw(el.dataset.key);else if(action==='addGrocery')groceryDialog();else if(action==='removeGrocery'){db.manualGroceries=db.manualGroceries.filter(i=>i.id!==id);persist();render()}
 else if(action==='shopFilter'){ui.shopFilter=el.dataset.value;render()}
 else if(action==='copyShopping')copyText(groceryText(ui.shopFilter));else if(action==='copyAllShopping')copyText(groceryText());else if(action==='addRecipe')editRecipeDialog();else if(action==='deleteRecipe'){if(confirm('Delete this custom recipe?')){db.recipes=db.recipes.filter(i=>i.id!==id);db.plan.forEach(day=>{if(day.recipe===id)day.recipe=null});persist();closeModal();render()}}

function spiceCondition(i){
 const qty=Number(i.qty)||0,limit=Number.isFinite(Number(i.lowAt))&&i.lowAt!==undefined&&i.lowAt!==''?Number(i.lowAt):0.5;
 const low=qty<=limit;

 return {low,expired,soon,limit};
}

// Files are kept in IndexedDB; only lightweight metadata is in localStorage.
const MEDIA_DB_NAME='shelf-to-supper-media-v1';
let mediaUrls=[],mediaRenderToken=0;
function mediaDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('This browser does not support local photo storage.'));const request=indexedDB.open(MEDIA_DB_NAME,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files',{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function mediaTransaction(mode,action){const database=await mediaDB();return new Promise((resolve,reject)=>{const tx=database.transaction('files',mode);const store=tx.objectStore('files');let request;try{request=action(store)}catch(e){database.close();reject(e);return}request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);tx.oncomplete=()=>database.close();tx.onerror=()=>{database.close();reject(tx.error)}})}
const putMedia=entry=>mediaTransaction('readwrite',store=>store.put(entry));
const getMedia=id=>mediaTransaction('readonly',store=>store.get(id));
const deleteMedia=id=>mediaTransaction('readwrite',store=>store.delete(id));
const getAllMedia=()=>mediaTransaction('readonly',store=>store.getAll());
const clearAllMedia=()=>mediaTransaction('readwrite',store=>store.clear());
async function saveFile(file){if(!file||!file.size)return null;if(file.size>18*1024*1024)throw Error('Keep each uploaded photo or document under 18 MB.');if(!(/^image\//.test(file.type)||file.type==='application/pdf'||/\.pdf$/i.test(file.name)))throw Error('Please select a photo or PDF.');const id=uid();await putMedia({id,blob:file,name:file.name,type:file.type||'application/octet-stream',at:new Date().toISOString()});return id}
async function hydrateMedia(){const nodes=[...document.querySelectorAll('[data-media-id]')];const token=++mediaRenderToken;for(const url of mediaUrls)URL.revokeObjectURL(url);mediaUrls=[];for(const el of nodes){const id=el.dataset.mediaId;if(!id)continue;try{const item=await getMedia(id);if(token!==mediaRenderToken)return;if(!item?.blob)continue;const url=URL.createObjectURL(item.blob);mediaUrls.push(url);if(el.tagName==='IMG')el.src=url;else if(el.tagName==='A')el.href=url;}catch(e){/* IndexedDB may be blocked in an in-app preview. */}}}
async function openMedia(id){try{const m=await getMedia(id);if(!m?.blob)return toast('File not found on this device.');const url=URL.createObjectURL(m.blob);window.open(url,'_blank','noopener,noreferrer');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){toast('Media not accessible in this browser.')}}

es to power accurate comparisons. Totals may include tax or nonfood products.</div><button type="submit" class="button primary" style="margin-top:15px">Save receipt</button></form>`)}
function parseReceiptLines(raw){const out=[];for(const row of String(raw||'').split(/\r?\n/).filter(x=>x.trim())){const parts=row.split('|').map(x=>x.trim());if(parts.length!==4)throw Error('Receipt item needs: item | amount | unit | line total.');const [name,n,unit,price]=parts;const qty=Number(n),total=Number(price.replace(/[$,]/g,''));if(!name||!Number.isFinite(qty)||qty<=0||!RECEIPT_UNITS.includes(unit)||!Number.isFinite(total)||total<0)throw Error('Check the quantity, unit or price for '+(name||'a line item')+'.');out.push({name:name.slice(0,120),qty,unit,total:Math.round(total*100)/100})}return out}
async function saveReceipt(form){const data=new FormData(form);let lines;try{lines=parseReceiptLines(data.get('lines'))}catch(e){return toast(e.message)}const total=Number(data.get('total'));if(!Number.isFinite(total)||total<0||!String(data.get('date')).match(/^\d{4}-\d{2}-\d{2}$/))return toast('Check purchase date and total.');const store=storeBy(String(data.get('store')));const docs=[];for(const name of ['photo','document']){const file=form.elements.namedItem(name).files?.[0];if(file&&file.size){try{const id=await saveFile(file);docs.push({id,name:file.name,type:file.type})}catch(e){return toast(e.message||'Could not save document.')}}}db.receipts.push({id:uid(),date:String(data.get('date')),store:store.id,total:Math.round(total*100)/100,type:data.get('type')==='invoice'?'invoice':'receipt',notes:String(data.get('notes')||'').trim(),lines,docs,created:new Date().toISOString()});persist();closeModal();ui.tab='receipts';render();toast('Purchase saved. Price history updated with itemized lines.')}
function standardLine(l){const unit=String(l.unit).toLowerCase();let quantity=Number(l.qty),std=unit;if(!quantity||quantity<=0)return null;if(unit==='oz'){std='lb';quantity/=16}else if(unit==='lb'){std='lb'}else if(unit==='fl oz'){std='gal';quantity/=128}else if(unit==='cup'){std='gal';quantity/=16}else if(unit==='quart'){std='gal';quantity/=4}else if(unit==='pint'){std='gal';quantity/=8}else if(unit==='gal'){std='gal'}else if(unit==='each'){std='each'}const comparable=['lb','gal','each'].includes(std);return {unit:std,unitPrice:Number(l.total)/quantity,qty:quantity,comparable}}
function recordedPrices(){return db.receipts.flatMap(r=>r.lines.map(l=>{const s=standardLine(l);return s?{...s,key:key(l.name),name:l.name,store:r.store,date:r.date,paid:Number(l.total),receiptId:r.id}:null}).filter(Boolean))}
function receiptDetails(id){const r=db.receipts.find(x=>x.id===id);if(!r)return;const sum=r.lines.reduce((t,l)=>t+l.total,0);modal(`${modalHead(safe(storeBy(r.store).name)+' · '+dateLabel(r.date))}<div class="buttonrow"><span class="pill">${r.type==='invoice'?'Online invoice':'Receipt'}</span><span class="pill blue">${fmtMoney(r.total)} total</span></div>${r.notes?`<p class="muted small" style="margin-top:12px">${safe(r.notes)}</p>`:''}<h3 style="margin-top:15px">Uploaded originals</h3><div class="buttonrow">${r.docs?.length?r.docs.map(d=>`<button class="button smallbtn" data-action="openMedia" data-id="${safe(d.id)}">${d.type==='application/pdf'?'📄 PDF':'📷 Photo'} · ${safe(d.name)}</button>`).join(''):'<p class="muted small">No documents attached</p>'}</div><h3 style="margin-top:17px">Price lines</h3>${r.lines.length?`<div style="overflow-x:auto"><table class="mini-table"><thead><tr><th>Item</th><th>Purchased</th><th>Paid</th><th>Unit price</th></tr></thead><tbody>${r.lines.map(l=>{const s=standardLine(l);return `<tr><td>${safe(l.name)}</td><td>${displayQty(l.qty)} ${safe(l.unit)}</td><td class="money">${fmtMoney(l.total)}</td><td>${s?fmtMoney(s.unitPrice)+' / '+safe(s.unit):'—'}</td></tr>`}).join('')}</tbody></table></div><p class="tiny">Itemized total: ${fmtMoney(sum)}. Receipt total: ${fmtMoney(r.total)}. The difference may reflect tax, discounts, shipping or other purchases.</p>`:'<p class="muted small">This receipt has a total but no itemized prices. Add item prices on your next receipt to build your price history.</p>'}<div class="buttonrow" style="margin-top:16px">${r.lines.length?`<button class="button smallbtn" data-action="receiptToInventory" data-id="${r.id}">＋ Add items to inventory</button>`:''}<button class="button danger smallbtn" data-action="deleteReceipt" data-id="${r.id}">Delete receipt</button></div>`)}

function saveReceiptInventory(form){const r=db.receipts.find(x=>x.id===form.dataset.id);if(!r)return;const fd=new FormData(form),space=fd.get('space');let count=0;
 r.lines.forEach((l,i)=>{if(!fd.has('item'+i))return;let unit=l.unit,qty=l.qty;
 if(unit==='gal'){unit='cup';qty*=16}else if(unit==='fl oz'){unit='cup';qty/=8}else if(unit==='quart'){unit='cup';qty*=4}else if(unit==='pint'){unit='cup';qty*=2}else if(unit==='case'){unit='package'};
 db.inventory.push({id:uid(),name:l.name,qty:qtyFmt(qty),unit,space,spot:'',expires:'',note:'From '+storeBy(r.store).name+' receipt'+(l.unit==='case'?' · Check case quantity':''),added:isoDate(new Date()),receiptId:r.id});count++});persist();closeModal();render();toast(`${count} item(s) added. Check case quantities and packages for accuracy.`)}

 <div class="grid three"><div class="stat"><div class="stat-label">Recorded purchases</div><strong>${sorted.length}</strong><span class="small muted">Receipts / invoices</span></div><div class="stat"><div class="stat-label">Last 30 days</div><strong>${fmtMoney(last30)}</strong><span class="small muted">From entered totals</span></div><div class="stat"><div class="stat-label">Item prices logged</div><strong>${count}</strong><span class="small muted">Used in comparisons</span></div></div>
 <div class="softpanel" style="margin-top:14px"><b>Make each receipt useful:</b> Take a photo, attach a scan or PDF, then record the store, total, and a few important item prices. Unit-price analysis uses only what you log, not advertised prices. <button class="button smallbtn" data-tab="insights">See trends ↗</button></div>
 <section class="panel" style="margin-top:15px"><h3>Purchase history</h3>${rows}</section><p class="note" style="margin-top:12px">Photos and PDFs are stored locally in this browser. Automatic OCR is not yet available. Total paid may include tax, delivery and nonfood goods.</p>`

function bestObserved(keyName,unit,age=180){const prices=recordedPrices().filter(x=>x.key===keyName&&x.comparable&&x.unit===unit&&recentDays(x.date,age));if(!prices.length)return null;prices.sort((a,b)=>a.unitPrice-b.unitPrice);return prices[0]}
function parseShoppingQuantity(txt){const m=String(txt||'').trim().match(/^(\d+(?:\.\d+)?)\s*(lb|oz|each|gal|fl oz|quart|pint|cup)\b/i);if(!m)return null;return standardLine({qty:Number(m[1]),unit:m[2].toLowerCase(),total:0})}
function buyingBasket(){let count=0,total=0,priced=[];for(const r of allGroceryRows().filter(x=>!x.done)){const q=parseShoppingQuantity(r.qty);if(!q||!q.comparable)continue;const source=bestObserved(key(r.name),q.unit);if(!source)continue;const value=source.unitPrice*q.qty;total+=value;count++;priced.push({name:r.name,quantity:r.qty,value,store:source.store,price:source.unitPrice,unit:source.unit,date:source.date})}return {count,total,priced}}
function spendByMonth(n=6){const now=new Date();const months=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const m=String(d.getMonth()+1).padStart(2,'0'),date=d.getFullYear()+'-'+m;months.push({key:date,label:d.toLocaleDateString(undefined,{month:'short'}),total:db.receipts.filter(r=>r.date?.startsWith(date)).reduce((n,r)=>n+Number(r.total),0)})}return months}
function priceOpportunities(){const groups=new Map();for(const r of recordedPrices().filter(p=>p.comparable&&recentDays(p.date,365))){const id=r.key+'|'+r.unit;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(r)}const opportunities=[];for(const [id,entries] of groups){const byStore=new Map();for(const e of entries){const prev=byStore.get(e.store);if(!prev||prev.date<e.date)byStore.set(e.store,e)}if(byStore.size<2)continue;const rows=[...byStore.values()].sort((a,b)=>a.unitPrice-b.unitPrice);const low=rows[0],high=rows[rows.length-1];if(high.unitPrice-low.unitPrice<.005)continue;opportunities.push({name:low.name,unit:low.unit,best:low,worst:high,gap:high.unitPrice-low.unitPrice,stores:rows.length})}return opportunities.sort((a,b)=>b.gap-a.gap)}
function priceChanges(){const groups=new Map();for(const p of recordedPrices().filter(p=>p.comparable)){const id=p.key+'|'+p.unit;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(p)}return [...groups.values()].filter(x=>x.length>1).map(v=>{v.sort((a,b)=>b.date.localeCompare(a.date));const latest=v[0],prior=v[1];return {name:latest.name,unit:latest.unit,current:latest.unitPrice,previous:prior.unitPrice,pct:prior.unitPrice>0?(latest.unitPrice/prior.unitPrice-1)*100:null,date:latest.date,store:latest.store}}).filter(v=>v.pct!==null).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct))}
function costcoComparison(){
 const values=[];
 for(const item of allGroceryRows().filter(x=>!x.done)){
  const q=parseShoppingQuantity(item.qty);if(!q||!q.comparable)continue;
  const entries=recordedPrices().filter(x=>x.key===key(item.name)&&x.comparable&&x.unit===q.unit&&recentDays(x.date,180));
  const local=entries.filter(x=>storeBy(x.store).kind==='local').sort((a,b)=>a.unitPrice-b.unitPrice)[0];
  const costco=entries.filter(x=>storeBy(x.store).kind==='costco').sort((a,b)=>a.unitPrice-b.unitPrice)[0];
  if(!local||!costco)continue;
  values.push({name:item.name,quantity:q.qty,unit:q.unit,local,costco,savings:(local.unitPrice-costco.unitPrice)*q.qty});
 }
 return {values,total:values.reduce((n,x)=>n+x.savings,0)};
}
function renderInsights(){
 const months=spendByMonth(ui.reportMonths),max=Math.max(1,...months.map(m=>m.total));
 const sum=months.reduce((n,m)=>n+m.total,0),prices=recordedPrices(),basket=buyingBasket();
 const tips=priceOpportunities().slice(0,8),changes=priceChanges().slice(0,8);
 const costco=costcoComparison(),tripCost=db.settings.costcoTripCost;
 const byStore=STORES.map(s=>({name:s.name,total:db.receipts.filter(r=>r.store===s.id&&recentDays(r.date,180)).reduce((n,r)=>n+r.total,0)})).filter(s=>s.total>0).sort((a,b)=>b.total-a.total);
 const bars=months.map(m=>`<div class="mini-bar-col"><div class="mini-bar" title="${safe(m.key)} · ${fmtMoney(m.total)}" style="height:${Math.max(2,Math.round(102*m.total/max))}px"></div><span>${m.label}</span></div>`).join('');
 const chart=db.receipts.length?`<div class="mini-bars" role="img" aria-label="Recorded monthly purchase totals">${bars}</div><div class="chart-legend">${months.map(m=>`${m.label} ${fmtMoney(m.total)}`).join(' · ')}</div>`:`<p class="small muted">Save receipts to see your spending history.</p>`;
 const stores=byStore.length?byStore.map(x=>`<div class="listrow"><b>${safe(x.name)}</b><span class="money">${fmtMoney(x.total)}</span></div>`).join(''):`<p class="small muted">No recorded purchases in the past 180 days.</p>`;
 const comparisons=tips.length?`<div style="overflow-x:auto"><table class="mini-table"><thead><tr><th>Item</th><th>Lower observed price</th><th>Higher observed price</th><th>Gap / unit</th></tr></thead><tbody>${tips.map(t=>`<tr><td><b>${safe(t.name)}</b><div class="tiny">per ${safe(t.unit)}</div></td><td class="value-positive">${fmtMoney(t.best.unitPrice)}<div class="tiny">${safe(storeBy(t.best.store).name)} · ${shortDate(t.best.date)}</div></td><td>${fmtMoney(t.worst.unitPrice)}<div class="tiny">${safe(storeBy(t.worst.store).name)} · ${shortDate(t.worst.date)}</div></td><td>${fmtMoney(t.gap)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🔎</div><h3>Compare the same item at two stores</h3><p class="muted small">Log an equivalent amount of ground beef at Costco and a local grocer to see your actual price difference.</p></div>`;
 const changeRows=changes.length?changes.map(c=>`<div class="listrow"><div class="item-main"><b>${safe(c.name)}</b><div class="item-sub">${fmtMoney(c.previous)} → ${fmtMoney(c.current)} per ${safe(c.unit)}</div></div><span class="${c.pct>0?'value-negative':'value-positive'}">${c.pct>0?'+':''}${c.pct.toFixed(1)}%</span></div>`).join(''):`<p class="muted small">Two purchases of a comparable item will produce a trend.</p>`;
 const basketRows=basket.priced.slice(0,7).map(b=>`<div class="listrow"><div class="item-main"><b>${safe(b.name)}</b><div class="item-sub">${safe(b.quantity)} · ${safe(storeBy(b.store).name)} · ${shortDate(b.date)}</div></div><span class="money">${fmtMoney(b.value)}</span></div>`).join('');
 return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">WHAT GROCERIES REALLY COST</div><h1>Trends & buying power</h1><p class="tagline">Your receipt history—not estimated online deals.</p></div><button class="button primary smallbtn" data-action="addReceipt">＋ Log receipt</button></div>
 <div class="grid three"><div class="stat"><div class="stat-label">${ui.reportMonths}-month recorded spend</div><strong>${fmtMoney(sum)}</strong><span class="small muted">Includes tax and nonfood items</span></div><div class="stat"><div class="stat-label">Item price observations</div><strong>${prices.length}</strong><span class="small muted">Receipt lines entered</span></div><div class="stat"><div class="stat-label">Estimated list subtotal</div><strong>${fmtMoney(basket.total)}</strong><span class="small muted">Only ${basket.count} price-supported unchecked items</span></div></div>
 <div class="grid two" style="margin-top:15px"><section class="panel"><h3>📊 Monthly purchases</h3>${chart}</section><section class="panel"><h3>🛍 Recorded spending by store</h3><p class="small muted">Last 180 days; higher spend doesn't mean worse prices.</p>${stores}</section></div>
 <section class="panel" style="margin-top:15px"><h3>📦 Is the Costco trip worth it?</h3><p class="small muted">Uses equivalent unchecked shopping quantities with recorded prices at both Costco and an Alexandria store, over the past 180 days. No current stock or advertised pricing assumed.</p>
 <div class="grid two"><div class="stat"><div class="stat-label">Observed Costco difference on matched items</div><strong>${fmtMoney(costco.total)}</strong><span class="small muted">${costco.values.length} matched items · positive means Costco was cheaper</span></div><div class="field"><label for="costcoTripCost">Estimated trip cost ($ fuel, etc.)</label><input type="number" min="0" step="1" id="costcoTripCost" placeholder="Your actual travel cost" value="${safe(tripCost??'')}"><div class="small muted">${costco.values.length&&tripCost!==undefined&&tripCost!==null&&tripCost!==''?`Net observed value after entered trip cost: <b>${fmtMoney(costco.total-Number(tripCost))}</b>`:'Record matched prices, then enter your trip cost to estimate net value.'}</div></div></div>
 ${costco.values.length?costco.values.map(x=>`<div class="listrow"><div class="item-main"><b>${safe(x.name)}</b><div class="item-sub">${displayQty(x.quantity)} ${safe(x.unit)} · Costco ${fmtMoney(x.costco.unitPrice)}/${safe(x.unit)} · local ${fmtMoney(x.local.unitPrice)}/${safe(x.unit)}</div></div><b class="${x.savings>=0?'value-positive':'value-negative'}">${fmtMoney(x.savings)}</b></div>`).join(''):'<p class="muted small" style="margin-top:10px">Once you log the same items at Costco and a local store, your shopping list will show the estimated difference for that trip.</p>'}<p class="tiny">This is not an overall basket comparison. Membership, time, discounts, quality differences, spoilage, and unmatched purchases are excluded.</p></section>
 <section class="panel" style="margin-top:15px"><h3>💰 Price differences between stores</h3><p class="small muted">Latest comparable unit price logged for each store in the past year. Not live sales or stock.</p>${comparisons}</section>
 <div class="grid two" style="margin-top:15px"><section class="panel"><h3>📈 Price increases & decreases</h3><p class="small muted">Most recent two recorded prices; stores and quality may differ.</p>${changeRows}</section><section class="panel"><h3>🧺 Buying power for your list</h3><p class="small muted">Uses the lowest observed comparable prices from the past 180 days. Not a full checkout estimate.</p><div class="stat" style="margin-bottom:10px"><div class="stat-label">Price-informed subtotal</div><strong>${fmtMoney(basket.total)}</strong><span class="small muted">${basket.count} of ${allGroceryRows().filter(x=>!x.done).length} unchecked items</span></div>${basketRows}${basket.count?'':`<p class="muted small">Add receipt line quantities and prices to activate this estimate.</p>`}</section></div>
 <p class="note" style="margin-top:15px">Receipt totals can include nonfood items, taxes and fees. Unit comparisons are restricted to pounds, gallons and comparable item counts. Bags, cans and packages of differing sizes cannot be fairly compared. Costco travel, membership fees and spoilage are not included.</p>`
}
async function exportBundle(){try{const media=await getAllMedia();const encoded=[];for(const m of media){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(m.blob)});encoded.push({id:m.id,name:m.name,type:m.type,dataUrl})}download('shelf-to-supper-full-backup-'+isoDate(new Date())+'.json',JSON.stringify({...db,__media:encoded}),'application/json');toast(`Backup includes ${encoded.length} photo / document attachments.`)}catch(e){toast('Could not export photos / receipts. Use a hosted HTTPS browser if this preview blocks storage.')}}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
